name: Lapang.id Continuous Deployment (CD) to AWS EC2

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    name: Build & Push Docker Images to GHCR
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry (GHCR)
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Downcase Repository Name for Docker Tag
        run: |
          echo "REPO_LOWER=${GITHUB_REPOSITORY,,}" >> $GITHUB_ENV

      - name: Build and Push Backend Image
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ env.REPO_LOWER }}-backend:latest
            ghcr.io/${{ env.REPO_LOWER }}-backend:${{ github.sha }}

      - name: Build and Push Frontend Image
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: true
          build-args: |
            NEXT_PUBLIC_API_URL=/api/v1
          tags: |
            ghcr.io/${{ env.REPO_LOWER }}-frontend:latest
            ghcr.io/${{ env.REPO_LOWER }}-frontend:${{ github.sha }}

  deploy-ec2:
    name: Deploy to AWS EC2 via Traditional SSH
    runs-on: ubuntu-latest
    needs: build-and-push
    steps:
      - name: Downcase Repository Name
        run: |
          echo "REPO_LOWER=${GITHUB_REPOSITORY,,}" >> $GITHUB_ENV

      - name: Execute Remote SSH Commands on EC2
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          port: 22
          envs: GITHUB_ACTOR,GITHUB_TOKEN,REPO_LOWER
          script: |
            set -e
            echo "🚀 [EC2 Deploy] Masuk ke direktori aplikasi..."
            cd /home/${{ secrets.EC2_USER }}/lapang

            echo "🔑 [EC2 Deploy] Login ke GHCR Container Registry..."
            echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

            echo "📦 [EC2 Deploy] Memperbarui image container terbaru..."
            BACKEND_IMAGE="ghcr.io/${{ env.REPO_LOWER }}-backend:latest" \
            FRONTEND_IMAGE="ghcr.io/${{ env.REPO_LOWER }}-frontend:latest" \
            docker compose -f docker-compose.prod.yml pull

            echo "🔄 [EC2 Deploy] Menjalankan rolling update container..."
            BACKEND_IMAGE="ghcr.io/${{ env.REPO_LOWER }}-backend:latest" \
            FRONTEND_IMAGE="ghcr.io/${{ env.REPO_LOWER }}-frontend:latest" \
            docker compose -f docker-compose.prod.yml up -d --remove-orphans

            echo "🧹 [EC2 Deploy] Membersihkan image lama yang tidak terpakai..."
            docker image prune -af --filter "until=48h" || true

            echo "✅ [EC2 Deploy] Deployment berhasil!"
